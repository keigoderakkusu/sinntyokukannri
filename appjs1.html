const fmtD = d=>{if(!d)return'—';const dt=new Date(d);return`${dt.getMonth()+1}/${dt.getDate()}`;};
const fmtDate = d=>{if(!d)return'';const dt=new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
const isPast = d=>d&&new Date(d)<todayD;
const isNear = d=>{if(!d)return false;const diff=(new Date(d)-todayD)/86400000;return diff>=0&&diff<=7;};
const getDiff = d=>{if(!d)return null;return Math.ceil((new Date(d)-todayD)/86400000);};

function showToast(msg,dur=2800){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}

  const el=document.getElementById('eco-badge');

}

function badgeHtml(status){
  const map={'量産終了':'badge-done','量産中':'badge-active','量産前':'badge-wait'};
  return`<span class="badge ${map[status]||'badge-wait'}">${status}</span>`;
}
function nearBadge(d){
  if(!d)return'';
  if(isPast(d))return'<span class="badge badge-done" style="font-size:9px;padding:1px 5px;">完了</span>';
  if(isNear(d))return'<span class="badge badge-warning" style="font-size:9px;padding:1px 5px;">直近</span>';
  return'';
}
function tdDate(d,mId,fKey){
  const past=isPast(d);const near=isNear(d);
  const style=near?'background:#fffbeb;font-weight:600;color:#d97706;':past?'color:#94a3b8;':'';
  const dblAttr=mId?`ondblclick="inlineEditDate(this,'${mId}','${fKey}')"`:'';
  return`<td class="mono center inline-editable" style="${style}" ${dblAttr}>${fmtD(d)} ${nearBadge(d)}</td>`;
}

function _loadXLSX(cb){
  if(typeof XLSX!=='undefined'){cb();return;}
  showToast('⏳ XLSXライブラリを読み込み中…');
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  s.onload=cb;
  s.onerror=()=>showToast('⚠️ XLSXの読み込みに失敗しました');
  document.head.appendChild(s);
}

function handleExcelImport(e){
  const file=e.target.files[0];if(!file)return;
  e.target.value='';
  _loadXLSX(function(){
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        // サン電子生産計画表（YYMMDD形式のシートが複数ある転置レイアウト）は
        // 専用パーサーへ自動振り分け。通常の「1行=1機種」形式のみ従来の取込を使う。
        if(wb.SheetNames.some(s=>/^\d{6}$/.test(s))){
          showToast('📊 サン電子生産計画表として取込みます');
          const wb2=XLSX.read(ev.target.result,{type:'binary',cellDates:true});
          const dated=wb2.SheetNames.filter(s=>/^\d{6}$/.test(s)).sort((a,b)=>b.localeCompare(a));
          const sheetName=dated[0]||wb2.SheetNames[0];
          const ws=wb2.Sheets[sheetName];
          const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
          showPage('future');
          parseSunDenshiRows(raw,sheetName);
          return;
        }
        showExcelSheetPicker(wb);
      }catch(err){showToast('⚠️ Excelファイルの読み込みに失敗しました');}
    };
    reader.readAsBinaryString(file);
  });
}

function showExcelSheetPicker(wb){
  const sheets=wb.SheetNames;
  // Prefer the latest dated sheet (MMDD format)
  const sorted=[...sheets].sort((a,b)=>b.localeCompare(a));
  const sheetName=sorted[0];
  const ws=wb.Sheets[sheetName];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  parseAndApplyExcelData(data,sheetName);
}

function parseAndApplyExcelData(rows,sheetName){
  const machineIds=new Set(MACHINES.map(m=>m.id));
  const updates=[];
  const dateRe=/^\d{4}-\d{2}-\d{2}$/;

  rows.forEach((row,ri)=>{
    const id=String(row[0]||'').trim();
    if(!machineIds.has(id))return;
    const m=MACHINES.find(x=>x.id===id);
    if(!m)return;

    // Try to extract dates from the row
    const dates=row.slice(1).map(c=>{
      if(!c)return null;
      if(c instanceof Date){
        return fmtDate(c);
      }
      const s=String(c).trim();
      if(dateRe.test(s))return s;
      // Excel serial number
      if(typeof c==='number'&&c>40000&&c<60000){
        const dt=XLSX.SSF.parse_date_code(c);
        if(dt)return`${dt.y}-${String(dt.m).padStart(2,'0')}-${String(dt.d).padStart(2,'0')}`;
      }
      return null;
    }).filter(Boolean);

    const person=String(row[1]||'').trim()||m.person;
    const notes=String(row[row.length-1]||'').trim()||state.notes[id];

    updates.push({id,person,dates,notes});
  });

  if(updates.length===0){showToast('⚠️ 対応する機種データが見つかりませんでした');return;}

  // Show preview in admin console
  showPage('admin');
  const previewDiv=document.getElementById('excel-preview');
  if(!previewDiv)return;

  const rows2=updates.map(u=>`
    <tr>
      <td><strong>${u.id}</strong></td>
      <td>${u.person}</td>
      <td>${u.dates.slice(0,4).join('、')||'—'}</td>
      <td style="font-size:11px;color:var(--text-sub);">${u.notes.substring(0,30)}</td>
    </tr>`).join('');

  previewDiv.innerHTML=`
    <div style="margin-bottom:8px;font-size:12px;font-weight:600;color:var(--text);">

    </table>
    <button class="btn btn-primary btn-sm" onclick="applyExcelUpdates(${JSON.stringify(updates).replace(/"/g,'&quot;')})">
      ✅ この内容で取込
    </button>
    <button class="btn btn-sm" style="margin-left:8px;" onclick="document.getElementById('excel-preview').innerHTML=''">キャンセル</button>`;
}

function applyExcelUpdates(updates){
  updates.forEach(u=>{
    const m=MACHINES.find(x=>x.id===u.id);
    if(!m)return;
    if(u.person)m.person=u.person;
    if(u.notes)state.notes[u.id]=u.notes;
    // Map dates by count heuristic
    const d=u.dates;
    const sc=state.schedules[u.id];
    if(d[0])sc.sampleShip=d[0];
    if(d[1])sc.prodImpl=d[1];
    if(d[2])sc.prodAssy=d[2];
    if(d[3])sc.prodShip=d[3];
  });
  addLog(`Excel取込: ${updates.map(u=>u.id).join(', ')}`);
  saveToGAS();renderPage(currentPage);
  document.getElementById('excel-preview').innerHTML='<div style="color:var(--success);font-weight:600;font-size:13px;">✅ 取込が完了しました</div>';
  showToast(`✅ ${updates.length}件 を取込みました`);
}

function getEstimatesForMachine(machineId){
  if(!state.linkageData)return[];
  const all=(state.linkageData.estimates||state.linkageData.quotes||[]);
  const mid=machineId.trim().toUpperCase();
  return all.filter(e=>{
    const eid=String(e.id||e.machineId||'').trim().toUpperCase();
    return eid===mid||eid.startsWith(mid)||mid.startsWith(eid);
  });

  }

function _buildGcalEvents(machineId){
  const ms=_getMs(machineId);
  if(!ms.goalDate)return[];
  const{quoteDeadline,poDeadline}=_computeMs(ms);
  const sc=state.schedules[machineId]||{};
  const rQ=parseInt(document.getElementById('gcal-reminder-quote')?.value||7);
  const rP=parseInt(document.getElementById('gcal-reminder-po')?.value||7);
  const rG=parseInt(document.getElementById('gcal-reminder-goal')?.value||14);
  const events=[];
  if(quoteDeadline)events.push({
    icon:'📄', title:`【${machineId}】見積書 提出締め切り`,
    date:quoteDeadline, emailDays:rQ,
    description:`機種: ${machineId}\n見積書提出の締め切り日です。\n初回納品日: ${ms.goalDate}`,
  });
  if(poDeadline)events.push({
    icon:'📝', title:`【${machineId}】注文書 受領締め切り`,
    date:poDeadline, emailDays:rP,
    description:`機種: ${machineId}\n注文書受領の締め切り日です。\n初回納品日: ${ms.goalDate}`,
  });
  events.push({
    icon:'🎯', title:`【${machineId}】初回納品（ゴール）`,
    date:ms.goalDate, emailDays:rG,
    description:`機種: ${machineId}\n初回納品（ゴール）日です。`,
  });
  // Scheduleフェーズ
  const phaseDefs=[
    {k:'sampleShip',label:'見本機出荷'},{k:'prodImpl',label:'量産実装'},
    {k:'prodAssy',label:'量産組立'},{k:'prodShip',label:'量産出荷'},
  ];
  phaseDefs.forEach(p=>{
    if(sc[p.k])events.push({
      icon:'📦', title:`【${machineId}】${p.label}`,
      date:sc[p.k], emailDays:3,
      description:`機種: ${machineId}\n${p.label} 予定日`,
    });
  });
  return events;
}

function closeGcalModal(){
  document.getElementById('gcal-modal').style.display='none';
}

function execGcalExport(){
  if(!_gcalMachineId)return;
  const events=_buildGcalEvents(_gcalMachineId);
  if(!events.length){showToast('⚠️ ゴール日が未設定です');return;}
  const calendarId=document.getElementById('gcal-calendar-id').value.trim();
  if(typeof google==='undefined'||!google.script){
    showToast('⚠️ GAS環境でのみ使用できます');return;
  }
  showToast('📅 カレンダーに登録中...');
  closeGcalModal();
  google.script.run
    .withSuccessHandler(res=>{
      try{
        const r=JSON.parse(res);
        if(r.success)showToast(`✅ ${r.created}件の予定を「${r.calendar}」に登録しました`);
        else showToast('⚠️ '+r.error);
      }catch(e){showToast('⚠️ レスポンスエラー');}
    })
    .withFailureHandler(err=>showToast('⚠️ '+err.message))
    .createMilestoneCalendarEvents(

      JSON.stringify(events),
      calendarId||''
    );
}

  }

function _buildSyncDiff(sheetMachines){
  const changes=[];
  sheetMachines.forEach(sm=>{
    const existing=MACHINES.find(m=>m.id===sm.id);
    if(!existing){
      changes.push({type:'add', id:sm.id, machine:sm, fields:[]});
    }else{
      const updated=[];
      const MAP=[
        ['person','担当者'],['compliance','適合'],['prodQty','量産台数'],['rom','ROM'],
        ['sampleImpl','見本機実装'],['sampleAssy','見本機組立'],['sampleShip','見本機出荷'],
        ['prodImpl','量産実装'],['prodAssy','量産組立'],['prodShip','量産出荷'],
        ['notes','備考'],
      ];
      MAP.forEach(([key,label])=>{
        const newVal=sm[key]||'';
        if(!newVal)return;
        const oldVal=String(existing[key]||'');
        if(newVal!==oldVal)updated.push({key,label,oldVal:oldVal||'(空)',newVal});
      });
      if(sm.status){
        const oldStatus=state.statuses[sm.id]||'';
        if(sm.status!==oldStatus)updated.push({key:'_status',label:'ステータス',oldVal:oldStatus||'(空)',newVal:sm.status});
      }
      if(sm.goalDate){
        const oldGoal=state.milestones[sm.id]?.goalDate||'';
        if(sm.goalDate!==oldGoal)updated.push({key:'_goalDate',label:'初回納品日',oldVal:oldGoal||'(空)',newVal:sm.goalDate});
      }
      if(updated.length)changes.push({type:'update', id:sm.id, machine:sm, fields:updated});
    }
  });
  return changes;
}

function previewSheetSync(){
  _callSyncSheet((r, div)=>{
    const diff=_buildSyncDiff(r.machines);
    if(!diff.length){
      div.innerHTML=`<div style="padding:16px;text-align:center;color:var(--success);font-size:13px;font-weight:600;">✅ 差分なし — スプレッドシートとシステムは同期済みです（${r.total}機種）</div>`;
      return;
    }
    const adds=diff.filter(d=>d.type==='add');
    const updates=diff.filter(d=>d.type==='update');
    let html=`<div style="font-size:12px;font-weight:700;margin-bottom:8px;">📊 同期プレビュー — ${r.total}機種中 ${diff.length}件の変更</div>`;
    if(adds.length){
      html+=`<div style="margin-bottom:8px;"><span style="background:var(--success);color:#fff;border-radius:4px;font-size:10px;padding:2px 8px;">＋ 新規 ${adds.length}件</span></div>`;
      html+=`<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px;">
        <tr style="background:#f0fdf4;"><th style="padding:4px 8px;text-align:left;border-bottom:1px solid #d1d5db;">機種名</th><th style="padding:4px 8px;text-align:left;border-bottom:1px solid #d1d5db;">担当</th><th style="padding:4px 8px;text-align:left;border-bottom:1px solid #d1d5db;">台数</th></tr>
        ${adds.map(a=>`<tr><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;font-weight:700;">${a.id}</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;">${a.machine.person||'—'}</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;">${a.machine.prodQty||'—'}</td></tr>`).join('')}
      </table>`;
    }
    if(updates.length){
      html+=`<div style="margin-bottom:8px;"><span style="background:var(--primary);color:#fff;border-radius:4px;font-size:10px;padding:2px 8px;">✏️ 更新 ${updates.length}件</span></div>`;

        ${updates.flatMap(u=>u.fields.map((f,i)=>`<tr><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;${i===0?'font-weight:700;':''}">${i===0?u.id:''}</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;">${f.label}</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;color:var(--text-muted);text-decoration:line-through;">${f.oldVal}</td><td style="padding:4px 8px;border-bottom:1px solid #f0f0f0;color:var(--primary);font-weight:600;">${f.newVal}</td></tr>`)).join('')}
      </table>`;
    }
    html+=`<div style="margin-top:8px;font-size:11px;color:var(--text-sub);">検出されたヘッダー列: ${r.detectedColumns.join(', ')}</div>`;
    html+=`<button class="btn btn-primary btn-sm" onclick="execSheetSync()" style="margin-top:10px;">✅ この内容で同期を実行</button>`;
    div.innerHTML=html;
  });
}

function execSheetSync(){
  _callSyncSheet((r, div)=>{
    const diff=_buildSyncDiff(r.machines);
    let addCount=0, updateCount=0;

    diff.forEach(d=>{
      if(d.type==='add'){
        const sm=d.machine;
        MACHINES.push({
          id:sm.id, person:sm.person||'', compliance:sm.compliance||'',
          prodQty:sm.prodQty||'', rom:sm.rom||'',
          sampleImpl:sm.sampleImpl||null, sampleAssy:sm.sampleAssy||null, sampleShip:sm.sampleShip||null,
          prodImpl:sm.prodImpl||null, prodAssy:sm.prodAssy||null, prodShip:sm.prodShip||null,
          boards:[], notes:sm.notes||'',
        });
        state.statuses[sm.id]=sm.status||'量産前';
        state.schedules[sm.id]={
          sampleImpl:sm.sampleImpl||null,sampleAssy:sm.sampleAssy||null,sampleShip:sm.sampleShip||null,
          prodImpl:sm.prodImpl||null,prodAssy:sm.prodAssy||null,prodShip:sm.prodShip||null,
        };
        state.eco[sm.id]={collection:0,disassembly:0,e_inspect:0,snb_inspect:0,assembly:0,delivered:0,newParts:0};
        state.notes[sm.id]=sm.notes||'';
        if(sm.goalDate){
          if(!state.milestones[sm.id])state.milestones[sm.id]={};
          state.milestones[sm.id].goalDate=sm.goalDate;
        }
        addLog(`📡 同期: ${sm.id} を新規追加`);
        addCount++;
      }else if(d.type==='update'){
        const sm=d.machine;
        const m=MACHINES.find(x=>x.id===sm.id);
        d.fields.forEach(f=>{
          if(f.key==='_status'){
            state.statuses[sm.id]=f.newVal;
          }else if(f.key==='_goalDate'){
            if(!state.milestones[sm.id])state.milestones[sm.id]={};
            state.milestones[sm.id].goalDate=f.newVal;
          }else{
            if(m)m[f.key]=f.newVal;
            if(['sampleImpl','sampleAssy','sampleShip','prodImpl','prodAssy','prodShip'].includes(f.key)){
              if(state.schedules[sm.id])state.schedules[sm.id][f.key]=f.newVal||null;
            }
            if(f.key==='notes')state.notes[sm.id]=f.newVal;
          }
        });
        addLog(`📡 同期: ${sm.id} を更新 (${d.fields.map(f=>f.label).join(',')})`);
        updateCount++;
      }
    });

    saveToGAS();
    state.config.syncSheetId=document.getElementById('sync-sheet-id')?.value?.trim()||'';
    state.config.syncSheetName=document.getElementById('sync-sheet-name')?.value?.trim()||'';
    saveToGAS();

    const msg=`✅ 同期完了: 新規 ${addCount}件、更新 ${updateCount}件（${r.sheetName}シート / ${r.total}機種）`;
    showToast(msg);
    if(div)div.innerHTML=`<div style="padding:14px;color:var(--success);font-size:13px;font-weight:600;">${msg}</div>`;
    renderAdmin();
    renderDashboard();
  });
}

async function fetchLinkageData(){
  const url=state.config.linkageUrl;
  if(!url){showToast('⚠️ URLを入力してください');return;}
  const div=document.getElementById('linkage-data');
  if(div)div.innerHTML='<div style="color:var(--text-sub);font-size:12px;">取得中...</div>';

  try{
    // GAS running: use server-side UrlFetchApp to avoid CORS
    if(typeof google!=='undefined'&&google.script){
      google.script.run
        .withSuccessHandler(data=>{
          if(data){
            try{state.linkageData=JSON.parse(data);}catch(e){state.linkageData={raw:data};}
          }else{state.linkageData=null;}
          renderLinkageData();
        })
        .withFailureHandler(()=>{
          if(div)div.innerHTML='<div class="alert-bar">⚠️ データ取得に失敗しました</div>';
        })
        .getLinkageData(url);
      return;
    }
    // Local: direct fetch
    const res=await fetch(url+'?action=getForLink');
    const json=await res.json();
    state.linkageData=json;
    renderLinkageData();
  }catch(err){
    if(div)div.innerHTML=`<div class="alert-bar">⚠️ 取得失敗 (CORS)。GAS上で実行するか、見積管理側に <code>getForLink</code> エンドポイントを追加してください。</div>`;
  }
}

          <div style="font-size:11px;font-weight:700;color:#7f1d1d;margin-bottom:6px;">📋 チェックリスト（見積管理GAS側）</div>

  const estimates=d.estimates||d.quotes||[];

    div.innerHTML=`<div style="color:var(--text-muted);font-size:12px;"><pre>${JSON.stringify(d,null,2).substring(0,400)}</pre></div>`;

/* ============================================================
   DRIVE FILE UPLOAD
============================================================ */
function _getDriveFiles(machineId){
  if(!state.driveFiles[machineId])state.driveFiles[machineId]=[];
  return state.driveFiles[machineId];
}

function handleDriveUpload(event, machineId){
  const file=event.target.files[0];
  if(!file)return;
  event.target.value='';
  if(file.size>20*1024*1024){showToast('⚠️ ファイルサイズは20MB以下にしてください');return;}
  showToast('📤 アップロード中...');
  const reader=new FileReader();
  reader.onload=ev=>{
    const base64=ev.target.result.split(',')[1];
    if(typeof google!=='undefined'&&google.script){
      google.script.run
        .withSuccessHandler(res=>{
          try{
            const r=JSON.parse(res);
            if(r.success){
              _getDriveFiles(machineId).push({fileId:r.fileId,fileName:r.fileName,url:r.url,uploadedAt:r.uploadedAt});
              saveToGAS();
              showToast('✅ アップロード完了: '+r.fileName);
              if(document.getElementById('drive-files-'+machineId))renderDriveFilesSection(machineId,true);
              renderDashboard();
            }else{showToast('⚠️ '+r.error);}
          }catch(e){showToast('⚠️ レスポンスエラー');}
        })
        .withFailureHandler(err=>showToast('⚠️ '+err.message))
        .uploadFileToDrive(file.name, base64, file.type||'application/octet-stream', machineId);
    }else{showToast('⚠️ GAS環境でのみアップロード可能です');}
  };
  reader.readAsDataURL(file);
}

function deleteDriveFile(machineId, fileId){
  if(!confirm('このファイルをDriveから削除しますか？'))return;
  const files=_getDriveFiles(machineId);
  const idx=files.findIndex(f=>f.fileId===fileId);
  if(idx<0)return;
  if(typeof google!=='undefined'&&google.script){
    google.script.run
      .withSuccessHandler(()=>{})
      .withFailureHandler(()=>{})
      .deleteFileFromDrive(fileId);
  }
  files.splice(idx,1);
  saveToGAS();
  showToast('🗑️ 削除しました');
  if(document.getElementById('drive-files-'+machineId))renderDriveFilesSection(machineId,true);
  renderDashboard();
}

            <td><button class="btn btn-sm btn-danger" onclick="deleteDriveFile('${machineId}','${f.fileId}')" title="削除">🗑️</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
  if(updateOnly){
    const el=document.getElementById('drive-files-'+machineId);
    if(el)el.outerHTML=`<div id="drive-files-${machineId}">${html}</div>`;
  }
  return `<div id="drive-files-${machineId}">${html}</div>`;
}

/* ============================================================
   GANTT DRAG / RESIZE
============================================================ */
const GANTT_START = new Date('2026-03-01');
const GANTT_END   = new Date('2026-09-30');
const GANTT_TOTAL = (GANTT_END-GANTT_START)/86400000; // 213

let ganttDrag=null;

function _clampGantt(d){
  return new Date(Math.max(Math.min(d.getTime(),GANTT_END.getTime()),GANTT_START.getTime()));
}
function _datePct(d){
  return (d-GANTT_START)/(GANTT_TOTAL*86400000)*100;
}
function _pctToDate(pct){
  const ms=GANTT_START.getTime()+pct/100*GANTT_TOTAL*86400000;
  return _clampGantt(new Date(ms));
}

// mode: 'move' | 'left' | 'right'
function startGanttMoveOrResize(e, mode){
  e.stopPropagation();
  // Walk up to the .gantt-bar element
  let bar=e.target;
  while(bar&&!bar.classList.contains('gantt-bar'))bar=bar.parentElement;
  if(!bar)return;
  const machineId=bar.dataset.machine;
  const phaseKey=bar.dataset.phase;
  const prevKey=bar.dataset.prev||'';
  if(!machineId||!phaseKey)return;
  const endDateStr=state.schedules[machineId]?.[phaseKey];
  if(!endDateStr)return;
  e.preventDefault();
  const timeline=bar.parentElement;
  const rect=timeline.getBoundingClientRect();
  const cw=rect.width;
  const endDate=new Date(endDateStr);
  // prevKey start date (for left-resize and move)
  const prevDateStr=prevKey?state.schedules[machineId]?.[prevKey]:null;
  const startDate=prevDateStr?new Date(prevDateStr):new Date(endDate.getTime()-10*86400000);

  ganttDrag={
    bar, machineId, phaseKey, prevKey, mode,
    startX:e.clientX,
    containerWidth:cw,
    origEndDate:new Date(endDate),
    origStartDate:new Date(startDate),
    origLeftPct:parseFloat(bar.style.left)||0,
    origWidthPct:parseFloat(bar.style.width)||2,
    pendingEnd:null, pendingStart:null,
  };
  bar.classList.add('dragging');
  document.addEventListener('mousemove',onGanttMouseMove);
  document.addEventListener('mouseup',onGanttMouseUp);
}
</script>
