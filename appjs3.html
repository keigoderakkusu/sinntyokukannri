<script>


/* ============================================================
   マイルストーン / ゴール逆算スケジュール
============================================================ */
const MS_DEFAULTS={quoteLeadDays:60, poLeadDays:30};

function _getMs(machineId){
  if(!state.milestones[machineId]) state.milestones[machineId]={
    goalDate:'', quoteLeadDays:MS_DEFAULTS.quoteLeadDays, poLeadDays:MS_DEFAULTS.poLeadDays,
    quoteSubmitted:false, poReceived:false, quoteSubmittedDate:'', poReceivedDate:'', notes:'',
  };
  return state.milestones[machineId];
}

function _computeMs(ms){
  if(!ms.goalDate)return{quoteDeadline:null,poDeadline:null};
  const g=new Date(ms.goalDate); g.setHours(0,0,0,0);
  const qd=new Date(g); qd.setDate(qd.getDate()-(ms.quoteLeadDays||MS_DEFAULTS.quoteLeadDays));
  const pd=new Date(g); pd.setDate(pd.getDate()-(ms.poLeadDays  ||MS_DEFAULTS.poLeadDays));
  return{quoteDeadline:fmtDate(qd), poDeadline:fmtDate(pd)};
}

// 見積管理システムから状態を検知
function _getLinkageStatus(machineId){
  const d=state.linkageData;
  if(!d)return{quoteFound:false,poFound:false,quoteStatus:null,poStatus:null};
  const estimates=(d.estimates||d.quotes||[]).filter(e=>{
    const eid=String(e.id||e.machineId||e.modelCode||'').toUpperCase();
    return eid===machineId.toUpperCase()||eid.includes(machineId.toUpperCase());
  });
  if(!estimates.length)return{quoteFound:false,poFound:false,quoteStatus:null,poStatus:null};
  const e=estimates[0]; // 最新/最初の一致
  // フィールド名を複数パターンで試みる
  const quoteSubmitted=!!(e.quoteSubmitted||e.quote_submitted||e.submitted||
    (e.status&&(e.status.includes('提出')||e.status.includes('submitted')||e.status.includes('見積済'))));
  const poReceived=!!(e.poReceived||e.po_received||e.orderReceived||e.order_received||
    (e.status&&(e.status.includes('注文書')||e.status.includes('受領')||e.status.includes('po')||e.status.includes('order'))));
  const quoteDate=e.quoteDate||e.quote_date||e.submittedDate||'';
  const poDate=e.poDate||e.po_date||e.orderDate||'';
  const quoteUrl=e.url||e.quoteUrl||e.quote_url||e.見積書URL||'';
  const orderUrl=e.orderUrl||e.order_url||e.注文書URL||'';
  return{quoteFound:true,quoteSubmitted,quoteDate,poReceived,poDate,
    status:e.status||'', amount:e.amount||'', customer:e.customer||e.client||'',
    quoteUrl, orderUrl};
}

function openMilestoneModal(machineId){
  const ms=_getMs(machineId);
  const ls=_getLinkageStatus(machineId);
  document.getElementById('ms-machine').value=machineId;
  document.getElementById('ms-goal').value=ms.goalDate||'';
  document.getElementById('ms-quote-lead').value=ms.quoteLeadDays||MS_DEFAULTS.quoteLeadDays;
  document.getElementById('ms-po-lead').value=ms.poLeadDays||MS_DEFAULTS.poLeadDays;
  document.getElementById('ms-quote-submitted').checked=ms.quoteSubmitted||ls.quoteSubmitted||false;
  document.getElementById('ms-po-received').checked=ms.poReceived||ls.poReceived||false;
  document.getElementById('ms-quote-submitted-date').value=ms.quoteSubmittedDate||ls.quoteDate||'';
  document.getElementById('ms-po-received-date').value=ms.poReceivedDate||ls.poDate||'';
  document.getElementById('ms-notes').value=ms.notes||'';

  // 見積管理システム連携ステータス表示
  const qDiv=document.getElementById('ms-quote-linkage-status');
  const pDiv=document.getElementById('ms-po-linkage-status');
  if(ls.quoteFound){
    const qTag=ls.quoteSubmitted
      ?'<span class="linkage-tag linked">🔗 見積管理: 提出済</span>'
      :'<span class="linkage-tag unlinked">🔗 見積管理: 未提出</span>';
    const pTag=ls.poReceived
      ?'<span class="linkage-tag linked">🔗 見積管理: 受領済</span>'
      :'<span class="linkage-tag unlinked">🔗 見積管理: 未受領</span>';
    if(qDiv)qDiv.innerHTML=qTag+(ls.customer?`<span style="font-size:10px;color:var(--text-muted);margin-left:6px;">${ls.customer}</span>`:'');
    if(pDiv)pDiv.innerHTML=pTag+(ls.amount?`<span style="font-size:10px;color:var(--text-muted);margin-left:6px;">¥${Number(ls.amount).toLocaleString()}</span>`:'');
  }else{
    const unknownTag='<span class="linkage-tag unknown">🔗 見積管理: 未連携 (管理コンソールで取得)</span>';
    if(qDiv)qDiv.innerHTML=unknownTag;
    if(pDiv)pDiv.innerHTML='';
  }

  _updateMsPreview();
  document.getElementById('milestone-modal').style.display='flex';
}
function closeMilestoneModal(){document.getElementById('milestone-modal').style.display='none';}

function _updateMsPreview(){
  const goalVal=document.getElementById('ms-goal').value;
  const qLead=parseInt(document.getElementById('ms-quote-lead').value)||MS_DEFAULTS.quoteLeadDays;
  const pLead=parseInt(document.getElementById('ms-po-lead').value)||MS_DEFAULTS.poLeadDays;
  const prev=document.getElementById('ms-computed-preview');
  if(!prev)return;
  if(!goalVal){prev.innerHTML='<span style="color:var(--text-muted);">ゴール日を設定すると逆算日程が表示されます</span>';return;}
  const g=new Date(goalVal);
  const qd=new Date(g); qd.setDate(qd.getDate()-qLead);
  const pd=new Date(g); pd.setDate(pd.getDate()-pLead);
  const today=new Date(); today.setHours(0,0,0,0);
  const df=(d)=>`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  const diff=(d)=>Math.ceil((d-today)/86400000);
  const diffLabel=(d)=>{const n=diff(d);return n<0?`<span style="color:var(--danger);">${Math.abs(n)}日超過</span>`:n===0?'<span style="color:var(--danger);">本日</span>':`<span style="color:var(--primary);">あと${n}日</span>`;};
  prev.innerHTML=`<div style="font-size:11px;font-weight:700;color:var(--success);margin-bottom:8px;">📐 逆算スケジュール</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:11px;">
      <div style="text-align:center;padding:8px;background:#eff6ff;border-radius:6px;">
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:3px;">📄 見積提出期限</div>
        <div style="font-weight:700;font-family:monospace;">${df(qd)}</div>
        <div>${diffLabel(qd)}</div>
      </div>
      <div style="text-align:center;padding:8px;background:#f0fdf4;border-radius:6px;">
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:3px;">📝 注文書受領期限</div>
        <div style="font-weight:700;font-family:monospace;">${df(pd)}</div>
        <div>${diffLabel(pd)}</div>
      </div>
      <div style="text-align:center;padding:8px;background:#fef9c3;border-radius:6px;">
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:3px;">🎯 初回納品（ゴール）</div>
        <div style="font-weight:700;font-family:monospace;">${df(g)}</div>
        <div>${diffLabel(g)}</div>
      </div>
    </div>`;
}

function autoFillGoalFromDdoc(){
  const machineId=document.getElementById('ms-machine').value;
  const docs=_getDdocs?_getDdocs(machineId):[];
  const allLines=docs.flatMap(d=>d.lines||[]).filter(l=>l.date).sort((a,b)=>a.date.localeCompare(b.date));
  if(!allLines.length){showToast('⚠️ 納入指示書に日付データがありません');return;}
  document.getElementById('ms-goal').value=allLines[0].date;
  _updateMsPreview();
  showToast(`✅ 初回納入日: ${allLines[0].date} をゴールに設定`);
}

function saveMilestoneModal(){
  const machineId=document.getElementById('ms-machine').value;
  const ms=_getMs(machineId);
  ms.goalDate=document.getElementById('ms-goal').value;
  ms.quoteLeadDays=parseInt(document.getElementById('ms-quote-lead').value)||MS_DEFAULTS.quoteLeadDays;
  ms.poLeadDays=parseInt(document.getElementById('ms-po-lead').value)||MS_DEFAULTS.poLeadDays;
  ms.quoteSubmitted=document.getElementById('ms-quote-submitted').checked;
  ms.poReceived=document.getElementById('ms-po-received').checked;
  ms.quoteSubmittedDate=document.getElementById('ms-quote-submitted-date').value;
  ms.poReceivedDate=document.getElementById('ms-po-received-date').value;
  ms.notes=document.getElementById('ms-notes').value.trim();
  saveToGAS();
  closeMilestoneModal();
  renderPage('flow');
  addLog(`${machineId} ゴール設定: ${ms.goalDate||'未設定'}`);
  showToast('✅ ゴールスケジュールを保存しました');
}

// アラート収集（ダッシュボード用）
function getMilestoneAlerts(){
  const today=new Date(); today.setHours(0,0,0,0);
  const alerts=[];
  MACHINES.forEach(m=>{
    const ms=state.milestones[m.id]; if(!ms||!ms.goalDate)return;
    const ls=_getLinkageStatus(m.id);
    const {quoteDeadline,poDeadline}=_computeMs(ms);
    const quoteOk=ms.quoteSubmitted||ls.quoteSubmitted;
    const poOk=ms.poReceived||ls.poReceived;
    if(quoteDeadline&&!quoteOk){
      const diff=Math.ceil((new Date(quoteDeadline)-today)/86400000);
      if(diff<=14) alerts.push({machineId:m.id,type:'quote',diff,deadline:quoteDeadline,label:'見積書未提出',urgent:diff<=0});
    }
    if(poDeadline&&!poOk){
      const diff=Math.ceil((new Date(poDeadline)-today)/86400000);
      if(diff<=14) alerts.push({machineId:m.id,type:'po',diff,deadline:poDeadline,label:'注文書未受領',urgent:diff<=0});
    }
  });
  return alerts;
}

function renderMilestoneSection(machineId){
  const ms=_getMs(machineId);
  const ls=_getLinkageStatus(machineId);
  const today=new Date(); today.setHours(0,0,0,0);

  // ゴールまでの日数
  const goalDiff=ms.goalDate?Math.ceil((new Date(ms.goalDate)-today)/86400000):null;

  if(!ms.goalDate){
    return `<div class="milestone-section">
      <div class="milestone-header">
        <h4>🎯 ゴール逆算スケジュール</h4>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);" onclick="openMilestoneModal('${machineId}')">＋ ゴール日を設定</button>
      </div>
      <div style="padding:24px;text-align:center;color:var(--text-muted);font-size:12px;">ゴール日（初回納品日）を設定すると見積書・注文書の逆算スケジュールが表示されます</div>
    </div>`;
  }

  const{quoteDeadline,poDeadline}=_computeMs(ms);
  const quoteOk=ms.quoteSubmitted||ls.quoteSubmitted;
  const poOk=ms.poReceived||ls.poReceived;

  // タイムライン上の位置（%）計算
  const span=Math.max(ms.quoteLeadDays||60,90); // 表示期間
  const pinPos=(date)=>{
    if(!date)return 0;
    const d=new Date(date);
    const goalD=new Date(ms.goalDate);
    const startD=new Date(goalD); startD.setDate(startD.getDate()-span);
    const total=goalD-startD;
    const offset=d-startD;
    return Math.max(0,Math.min(100,Math.round(offset/total*100)));
  };
  const todayPct=pinPos(fmtDate(today));
  const quotePct=pinPos(quoteDeadline);
  const poPct=pinPos(poDeadline);

  // 各ピンの色
  const quoteColor=quoteOk?'#16a34a':quoteDeadline&&new Date(quoteDeadline)<today?'#dc2626':'#2563eb';
  const poColor=poOk?'#16a34a':poDeadline&&new Date(poDeadline)<today?'#dc2626':'#d97706';
  const goalColor=goalDiff!==null&&goalDiff<0?'#dc2626':goalDiff!==null&&goalDiff<=30?'#d97706':'#7c3aed';

  const fmtShort=(d)=>{if(!d)return'';const dt=new Date(d);return`${dt.getMonth()+1}/${dt.getDate()}`;};

  const qDiff=quoteDeadline?Math.ceil((new Date(quoteDeadline)-today)/86400000):null;
  const pDiff=poDeadline?Math.ceil((new Date(poDeadline)-today)/86400000):null;
  const diffStr=(d,ok)=>ok?'<span style="color:var(--success);">✅ 完了</span>':d===null?'—':d<0?`<span style="color:var(--danger);font-weight:700;">⚠️ ${Math.abs(d)}日超過</span>`:d===0?'<span style="color:var(--danger);font-weight:700;">⚠️ 本日期限</span>':`あと<span class="ms-counter">${d}</span>日`;

  const quoteCardClass=quoteOk?'ok':qDiff!==null&&qDiff<=7?'alert':qDiff!==null&&qDiff<=14?'warn':'';
  const poCardClass=poOk?'ok':pDiff!==null&&pDiff<=7?'alert':pDiff!==null&&pDiff<=14?'warn':'';

  // 見積管理連携タグ
  const linkageHtml=ls.quoteFound
    ?`<span class="linkage-tag linked">🔗 見積管理連携済</span> <span style="font-size:10px;color:var(--text-sub);">${ls.customer}${ls.amount?' ¥'+Number(ls.amount).toLocaleString():''}</span>`
    :`<span class="linkage-tag unknown">🔗 見積管理: 未連携</span>`;

  return `<div class="milestone-section">
    <div class="milestone-header" style="justify-content:space-between;">
      <div>
        <h4 style="margin-bottom:2px;">🎯 ゴール逆算スケジュール</h4>
        <div style="font-size:10px;color:rgba(255,255,255,.6);">初回納品まで <strong style="font-size:14px;color:${goalDiff!==null&&goalDiff<=30?'#fbbf24':'#fff'};">${goalDiff!==null?goalDiff+'日':'—'}</strong></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        ${linkageHtml}
        <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);" onclick="openGcalModal('${machineId}')">📅 カレンダー登録</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);" onclick="openMilestoneModal('${machineId}')">⚙️ 設定</button>
      </div>
    </div>
    <div class="milestone-body">
      <!-- タイムライン -->
      <div style="position:relative;margin:0 8px 0;">
        <div class="timeline-track">
          <div class="timeline-fill" style="width:${todayPct}%;"></div>
          <!-- 今日 -->
          <div class="timeline-pin" style="left:${todayPct}%;">
            <div style="font-size:9px;position:absolute;bottom:10px;white-space:nowrap;transform:translateX(-50%);color:var(--text-muted);">TODAY</div>
            <div class="timeline-pin-dot" style="background:#94a3b8;"></div>
          </div>
          <!-- 見積期限 -->
          <div class="timeline-pin" style="left:${quotePct}%;">
            <div class="timeline-pin-dot" style="background:${quoteColor};"></div>
            <div class="timeline-pin-label" style="color:${quoteColor};">📄 見積<br>${fmtShort(quoteDeadline)}</div>
          </div>
          <!-- 注文書期限 -->
          <div class="timeline-pin" style="left:${poPct}%;">
            <div class="timeline-pin-dot" style="background:${poColor};"></div>
            <div class="timeline-pin-sub" style="color:${poColor};">📝 注文書<br>${fmtShort(poDeadline)}</div>
          </div>
          <!-- ゴール -->
          <div class="timeline-pin" style="left:100%;">
            <div class="timeline-pin-dot" style="background:${goalColor};width:18px;height:18px;"></div>
            <div class="timeline-pin-label" style="color:${goalColor};font-weight:800;">🎯 ${fmtShort(ms.goalDate)}</div>
          </div>
        </div>
      </div>

      <!-- カード -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px;">

        <div class="milestone-card ${quoteCardClass}">
          <div class="milestone-icon">${quoteOk?'✅':'📄'}</div>
          <div class="milestone-info">
            <h5>見積書 提出</h5>
            <div class="date-row">${quoteDeadline?fmtShort(quoteDeadline)+` (${quoteDeadline})`:'未設定'}</div>
            <div class="status-row">${diffStr(qDiff,quoteOk)}</div>
            ${ms.quoteSubmittedDate?`<div style="font-size:10px;color:var(--text-sub);margin-top:3px;">提出日: ${ms.quoteSubmittedDate}</div>`:''}
            ${ls.quoteFound&&!ms.quoteSubmitted?`<div style="margin-top:5px;">${ls.quoteSubmitted?'<span class="linkage-tag linked">見積管理: 提出済</span>':'<span class="linkage-tag unlinked">見積管理: 未提出</span>'}</div>`:''}
            ${ls.quoteUrl?`<div style="margin-top:6px;"><a href="${ls.quoteUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#fff;background:#2563eb;padding:3px 10px;border-radius:6px;text-decoration:none;">📄 見積書PDF</a></div>`:''}
          </div>
        </div>

        <div class="milestone-card ${poCardClass}">
          <div class="milestone-icon">${poOk?'✅':'📝'}</div>
          <div class="milestone-info">
            <h5>注文書 受領</h5>
            <div class="date-row">${poDeadline?fmtShort(poDeadline)+` (${poDeadline})`:'未設定'}</div>
            <div class="status-row">${diffStr(pDiff,poOk)}</div>
            ${ms.poReceivedDate?`<div style="font-size:10px;color:var(--text-sub);margin-top:3px;">受領日: ${ms.poReceivedDate}</div>`:''}
            ${ls.quoteFound&&!ms.poReceived?`<div style="margin-top:5px;">${ls.poReceived?'<span class="linkage-tag linked">見積管理: 受領済</span>':'<span class="linkage-tag unlinked">見積管理: 未受領</span>'}</div>`:''}
            ${ls.orderUrl?`<div style="margin-top:6px;"><a href="${ls.orderUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#fff;background:#16a34a;padding:3px 10px;border-radius:6px;text-decoration:none;">📝 注文書PDF</a></div>`:''}
          </div>
        </div>

        <div class="milestone-card ${goalDiff!==null&&goalDiff<=30&&goalDiff>0?'warn':goalDiff!==null&&goalDiff<=0?'alert':'ok'}" style="border-left:4px solid ${goalColor};">
          <div class="milestone-icon">🎯</div>
          <div class="milestone-info">
            <h5>初回納品（ゴール）</h5>
            <div class="date-row">${ms.goalDate}</div>
            <div class="status-row">${diffStr(goalDiff,false).replace('あと','残り')}</div>
            ${ms.notes?`<div style="font-size:10px;color:var(--text-sub);margin-top:3px;">${ms.notes}</div>`:''}
          </div>
        </div>

      </div>
    </div>
  </div>`;
}

/* ============================================================
   生産計画書 / 納入指示書 管理
============================================================ */
function _getDdocs(machineId){
  if(!state.deliveryDocs[machineId])state.deliveryDocs[machineId]=[];
  return state.deliveryDocs[machineId];
}

function openDdocModal(machineId, docId){
  document.getElementById('ddoc-machine').value=machineId;
  document.getElementById('ddoc-id').value=docId||'';
  document.getElementById('ddoc-parse-preview').innerHTML='';
  const today=new Date(); today.setHours(0,0,0,0);
  if(docId){
    const doc=_getDdocs(machineId).find(d=>d.id===docId);
    if(doc){
      document.getElementById('ddoc-type').value=doc.docType||'納入指示書';
      document.getElementById('ddoc-no').value=doc.docNo||'';
      document.getElementById('ddoc-issue-date').value=doc.issueDate||'';
      document.getElementById('ddoc-from').value=doc.from||'';
      document.getElementById('ddoc-note').value=doc.note||'';
      _renderDdocLines(doc.lines||[]);
      document.getElementById('ddoc-modal-title').textContent=`📋 ${doc.docType||'書類'} 編集`;
      document.getElementById('ddoc-modal').style.display='flex';
      return;
    }
  }
  // New
  document.getElementById('ddoc-type').value='納入指示書';
  document.getElementById('ddoc-no').value='';
  document.getElementById('ddoc-issue-date').value=fmtDate(today);
  document.getElementById('ddoc-from').value='';
  document.getElementById('ddoc-note').value='';
  _renderDdocLines([{id:'l'+Date.now(),date:'',qty:'',destination:'',note:''}]);
  document.getElementById('ddoc-modal-title').textContent='📋 書類インポート / 新規登録';
  document.getElementById('ddoc-modal').style.display='flex';
}
function closeDdocModal(){document.getElementById('ddoc-modal').style.display='none';}

function _renderDdocLines(lines){
  const wrap=document.getElementById('ddoc-lines-wrap'); if(!wrap)return;
  if(!lines.length){wrap.innerHTML='<div style="font-size:11px;color:var(--text-muted);padding:4px 0;">（行なし）</div>';return;}
  wrap.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:12px;">
    <thead><tr style="background:#f8fafc;">
      <th style="padding:5px 8px;border:1px solid var(--border-light);width:120px;">納入日</th>
      <th style="padding:5px 8px;border:1px solid var(--border-light);width:100px;">台数</th>
      <th style="padding:5px 8px;border:1px solid var(--border-light);">納品先</th>
      <th style="padding:5px 8px;border:1px solid var(--border-light);">備考</th>
      <th style="padding:5px 8px;border:1px solid var(--border-light);width:40px;"></th>
    </tr></thead>
    <tbody>${lines.map((l,i)=>`<tr>
      <td style="padding:3px 4px;border:1px solid var(--border-light);">
        <input type="date" value="${l.date||''}" style="width:100%;font-size:11px;" data-li="${i}" data-lk="date" onchange="updateDdocLineField(this)">
      </td>
      <td style="padding:3px 4px;border:1px solid var(--border-light);">
        <input type="text" value="${l.qty||''}" placeholder="例: 500台" style="width:100%;font-size:11px;" data-li="${i}" data-lk="qty" onchange="updateDdocLineField(this)">
      </td>
      <td style="padding:3px 4px;border:1px solid var(--border-light);">
        <input type="text" value="${l.destination||''}" placeholder="例: 〇〇ホール / 倉庫" style="width:100%;font-size:11px;" data-li="${i}" data-lk="destination" onchange="updateDdocLineField(this)">
      </td>
      <td style="padding:3px 4px;border:1px solid var(--border-light);">
        <input type="text" value="${l.note||''}" placeholder="備考" style="width:100%;font-size:11px;" data-li="${i}" data-lk="note" onchange="updateDdocLineField(this)">
      </td>
      <td style="padding:3px 4px;border:1px solid var(--border-light);text-align:center;">
        <button class="btn btn-sm" style="padding:1px 5px;color:var(--danger);" onclick="removeDdocLine(${i})">✕</button>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
  // store lines in memory for edits
  window._ddocEditLines=lines.map(l=>({...l}));
}

function updateDdocLineField(el){
  const i=parseInt(el.dataset.li); const k=el.dataset.lk;
  if(!window._ddocEditLines)return;

// Excel自動解析
function handleDdocExcelImport(e){
  const file=e.target.files[0]; if(!file)return;
  e.target.value='';
  _loadXLSX(function(){
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary',cellDates:true});
      const sheetName=wb.SheetNames[0];
      const ws=wb.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
      _parseDdocRows(rows, sheetName);
    }catch(err){showToast('⚠️ 読み込みエラー: '+err.message);}
  };
  reader.readAsBinaryString(file);
  }); // _loadXLSX
}

function _parseDdocRows(rows, sheetName){
  const prev=document.getElementById('ddoc-parse-preview');
  // ヘッダー行を探す（日付・台数・納品先などのキーワード含む行）
  const DATE_KEYS =['日付','納入日','納品日','出荷日','date','Date','指示日','納期'];
  const QTY_KEYS  =['台数','数量','qty','Qty','本数','個数','生産数','注文数'];
  const DEST_KEYS =['納品先','納入先','先','宛先','destination','場所','ホール'];

  let headerRowIdx=-1, dateCol=-1, qtyCol=-1, destCol=-1, noteCol=-1;

  for(let r=0;r<Math.min(rows.length,20);r++){
    const row=rows[r]; if(!row)continue;
    const cells=row.map(c=>String(c||'').trim().toLowerCase());
    const di=cells.findIndex(c=>DATE_KEYS.some(k=>c.includes(k.toLowerCase())));
    const qi=cells.findIndex(c=>QTY_KEYS.some(k=>c.includes(k.toLowerCase())));
    const dsti=cells.findIndex(c=>DEST_KEYS.some(k=>c.includes(k.toLowerCase())));
    if(di>=0||qi>=0){
      headerRowIdx=r; dateCol=di; qtyCol=qi; destCol=dsti;
      // note col: any remaining text column
      for(let ci=0;ci<row.length;ci++){
        if(ci!==di&&ci!==qi&&ci!==dsti&&row[ci]){noteCol=ci;break;}
      }
      break;
    }
  }

  // If no header found, try to auto-detect date+qty pattern in data
  if(headerRowIdx<0){
    for(let r=0;r<Math.min(rows.length,40);r++){
      const row=rows[r]; if(!row)continue;
      for(let c=0;c<row.length;c++){
        const v=row[c];
        if(v&&_excelDateStr&&_excelDateStr(v)){
          // look for a numeric column nearby
          for(let c2=0;c2<row.length;c2++){
            const v2=row[c2];
            if(c2!==c&&v2&&!isNaN(parseInt(String(v2).replace(/[^\d]/g,'')))){
              headerRowIdx=r-1<0?0:r-1; dateCol=c; qtyCol=c2;
              break;
            }
          }
          if(dateCol>=0)break;
        }
      }
      if(dateCol>=0)break;
    }
  }

  const dataStart=headerRowIdx>=0?headerRowIdx+1:0;
  const lines=[];

  for(let r=dataStart;r<rows.length;r++){
    const row=rows[r]; if(!row)continue;
    const rawDate=dateCol>=0?row[dateCol]:null;
    const rawQty =qtyCol>=0?row[qtyCol]:null;
    if(!rawDate&&!rawQty)continue;
    const dateStr=_excelDateStr?_excelDateStr(rawDate):(rawDate?String(rawDate):'');
    if(!dateStr&&!rawQty)continue;
    const qtyStr=rawQty?String(rawQty).trim():'';
    const destStr=destCol>=0&&row[destCol]?String(row[destCol]).trim():'';
    const noteStr=noteCol>=0&&row[noteCol]?String(row[noteCol]).trim():'';
    if(dateStr||qtyStr)
      lines.push({id:'l'+Date.now()+r, date:dateStr, qty:qtyStr, destination:destStr, note:noteStr});
  }

  if(!lines.length){
    if(prev)prev.innerHTML='<div style="color:var(--danger);font-size:11px;">⚠️ 日付・台数データが見つかりませんでした。手動で入力してください。</div>';
    return;
  }

  // 書類No.自動入力
  if(!document.getElementById('ddoc-no').value){
    document.getElementById('ddoc-no').value=sheetName;
  }

  window._ddocEditLines=lines;
  _renderDdocLines(lines);
  if(prev)prev.innerHTML=`<div style="color:var(--success);font-size:11px;font-weight:600;">✅ ${lines.length}行を取込みました（シート: ${sheetName}）</div>`;
}

// フロー内に書類サマリを描画
function renderDdocSection(machineId){
  const docs=_getDdocs(machineId);
  if(!docs.length) return `
    <div class="table-wrap" style="margin-top:12px;">
      <div class="table-toolbar">
        <div style="font-size:13px;font-weight:700;">📋 生産計画書 / 納入指示書</div>
        <button class="btn btn-primary btn-sm" onclick="openDdocModal('${machineId}')">＋ 書類登録 / Excelインポート</button>
      </div>
      <div style="padding:28px;text-align:center;color:var(--text-muted);font-size:12px;">書類未登録 — 「書類登録」からExcelをインポートするか手動入力してください</div>
    </div>`;

  const docCards=docs.map(doc=>{
    const typeClass=doc.docType==='生産計画書'?'seisan':'delivery';
    const total=doc.lines?doc.lines.reduce((s,l)=>{
      const n=parseInt(String(l.qty||'0').replace(/[^\d]/g,''))||0; return s+n;
    },0):0;
    const today=new Date(); today.setHours(0,0,0,0);
    const lineRows=doc.lines&&doc.lines.length?doc.lines.map(l=>{
      const d=l.date?new Date(l.date):null;
      const diff=d?Math.ceil((d-today)/86400000):null;
      const past=diff!==null&&diff<0;
      const near=diff!==null&&diff>=0&&diff<=14;
      const dStyle=past?'color:var(--text-muted);text-decoration:line-through;':near?'color:var(--danger);font-weight:700;':'';
      const badge=past?'<span style="font-size:9px;background:#e2e8f0;color:var(--text-muted);padding:1px 5px;border-radius:4px;margin-left:4px;">納入済</span>':
                  near?`<span style="font-size:9px;background:#fef2f2;color:var(--danger);padding:1px 5px;border-radius:4px;margin-left:4px;">あと${diff}日</span>`:'';
      return `<tr>
        <td style="${dStyle}">${l.date?`${new Date(l.date).getMonth()+1}/${new Date(l.date).getDate()}（${['日','月','火','水','木','金','土'][new Date(l.date).getDay()]}）`:'—'}${badge}</td>
        <td><span class="qty-pill">${l.qty||'—'}</span></td>
        <td style="font-size:12px;">${l.destination||'—'}</td>
        <td style="font-size:11px;color:var(--text-sub);max-width:160px;">${l.note||''}</td>
      </tr>`;
    }).join(''):
    `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:16px;">明細なし</td></tr>`;

    return `<div class="ddoc-card">
      <div class="ddoc-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="ddoc-type-badge ${typeClass}">${doc.docType}</span>
          ${doc.docNo?`<span style="font-size:12px;font-weight:700;font-family:monospace;">${doc.docNo}</span>`:''}
          ${doc.from?`<span style="font-size:11px;color:var(--text-sub);">from: ${doc.from}</span>`:''}
          ${doc.issueDate?`<span style="font-size:11px;color:var(--text-muted);">発行: ${doc.issueDate}</span>`:''}
          ${total>0?`<span style="font-size:11px;color:var(--text-sub);">合計: <strong>${total.toLocaleString()}台</strong></span>`:''}
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm" onclick="openDdocModal('${machineId}','${doc.id}')">✏️ 編集</button>
          <button class="btn btn-sm" style="color:var(--danger);" onclick="deleteDdoc('${machineId}','${doc.id}')">削除</button>
        </div>
      </div>
      ${doc.note?`<div style="padding:6px 14px;background:#fffbeb;font-size:11px;color:var(--warning);border-bottom:1px solid var(--border-light);">⚠️ ${doc.note}</div>`:''}
      <table class="ddoc-line-tbl">
        <thead><tr><th>納入日</th><th>台数</th><th>納品先</th><th>備考</th></tr></thead>
        <tbody>${lineRows}</tbody>
      </table>
    </div>`;
  }).join('');

  return `<div class="table-wrap" style="margin-top:12px;">
    <div class="table-toolbar">
      <div style="font-size:13px;font-weight:700;">📋 生産計画書 / 納入指示書 <span style="font-size:11px;font-weight:400;color:var(--text-muted);">${docs.length}件</span></div>
      <button class="btn btn-primary btn-sm" onclick="openDdocModal('${machineId}')">＋ 書類追加 / Excelインポート</button>
    </div>
    <div style="padding:14px 16px;">${docCards}</div>
  </div>`;
}

function updateFutureBadge(){
  const el=document.getElementById('future-badge');
  if(el)el.textContent=state.futureModels.length;
}

function renderFuturePage(){
  updateFutureBadge();
  const today=new Date(); today.setHours(0,0,0,0);

  // フィールド定義（セクション付き）
  const DATE_FIELDS=[
    {key:'salesDate',label:'販売予定日',sec:'base'},
    {key:'complianceDate',label:'適合日',sec:'base'},
    {key:'productionPlanDate',label:'生産計画日',sec:'base'},
    {key:'materialDate',label:'材料手配日',sec:'base'},
    {key:'mountingDate',label:'実装手配日',sec:'base'},
    {key:'hallDate',label:'ホール導入日',sec:'base'},
    {key:'sampleDeliveryDate',label:'初回納品日',sec:'sample'},
    {key:'prodFirstImplDate',label:'初回実装日',sec:'prod'},
    {key:'prodFirstAssyDate',label:'初回組立日',sec:'prod'},
    {key:'prodFirstDeliveryDate',label:'初回納品日',sec:'prod'},
    {key:'deliveryDate',label:'納入日',sec:'prod'},
  ];

  const fmtCell=(m,f)=>{
    const v=m[f.key]||'';
    if(!v)return`<td class="inline-editable" style="text-align:center;color:var(--text-muted);" onclick="openFutureCell(this,'${m.id}','${f.key}')">—</td>`;
    const d=new Date(v); const diff=Math.ceil((d-today)/86400000);
    let style='text-align:center;cursor:pointer;';
    if(diff<0)style+='color:var(--text-muted);text-decoration:line-through;';
    else if(diff<=14)style+='color:var(--danger);font-weight:700;';
    else if(diff<=30)style+='color:var(--warning);font-weight:600;';
    const disp=`${d.getMonth()+1}/${d.getDate()}`;
    return`<td class="inline-editable" style="${style}" onclick="openFutureCell(this,'${m.id}','${f.key}')">${disp}</td>`;
  };

  const rows=state.futureModels.map(m=>{
    const compStyle=m.complianceStatus==='承認済'?'color:#16a34a;font-weight:700;':m.complianceStatus==='申請中'?'color:#d97706;font-weight:700;':'color:var(--text-muted);';
    return`<tr>
      <td><strong style="font-family:monospace;font-size:11px;">${m.code}</strong></td>
      <td style="font-size:12px;max-width:120px;">${m.name||'—'}</td>
      <td style="font-size:11px;${compStyle}">${m.complianceStatus||'—'}</td>
      <td style="font-size:10px;max-width:100px;color:var(--text-sub);" title="${m.code12D||''}">${(m.code12D||'').substring(0,12)||'—'}</td>
      ${DATE_FIELDS.filter(f=>f.sec==='base').map(f=>fmtCell(m,f)).join('')}
      <td style="font-size:11px;max-width:90px;">${m.sampleBoard||'—'}</td>
      <td style="font-size:11px;max-width:80px;">${m.sampleBoardType||'—'}</td>
      ${DATE_FIELDS.filter(f=>f.sec==='sample').map(f=>fmtCell(m,f)).join('')}
      ${DATE_FIELDS.filter(f=>f.sec==='prod').map(f=>fmtCell(m,f)).join('')}
      <td style="font-size:11px;text-align:center;">${m.prodQtyActual||'—'}</td>
      <td style="font-size:11px;max-width:80px;">${m.prodRomType||'—'}</td>
      <td style="font-size:10px;color:var(--text-sub);max-width:100px;" title="${m.prodMemo||m.memo||''}">${((m.prodMemo||m.memo)||'').substring(0,14)||'—'}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-sm" style="padding:2px 8px;" onclick="openFutureEditModal('${m.id}')">編集</button>
        <button class="btn btn-sm" style="padding:2px 8px;color:var(--danger);" onclick="deleteFutureModel('${m.id}')">削除</button>
      </td>
    </tr>`;
  }).join('');

  const colCount=4+DATE_FIELDS.length+5;
  const empty=`<tr><td colspan="${colCount}" style="text-align:center;padding:48px;color:var(--text-muted);">将来機種データなし — 「追加」または「Excel取込」で登録してください</td></tr>`;

  const lastImp=state.config.lastSunDenshiImportAt;
  const daysSince=lastImp?Math.floor((todayD-new Date(lastImp))/86400000):null;
  const impBadge=lastImp
    ? `<span style="font-size:11px;color:${daysSince>35?'var(--danger)':'var(--text-sub)'};">最終取込: ${lastImp}${daysSince>35?`（${daysSince}日前・更新推奨）`:''}</span>`
    : `<span style="font-size:11px;color:var(--danger);">⚠️ 生産計画Excel未取込</span>`;

  document.getElementById('page-future').innerHTML=`
    <div class="page-heading">
      <div><h2>🔭 将来機種計画</h2><p>2年先までの販売予定機種を管理 ／ 日付セルをクリックで直接編集</p></div>
      <div style="display:flex;gap:8px;align-items:center;">
        ${impBadge}
        <label class="btn btn-sm" style="cursor:pointer;">
          📥 サン電子生産計画表 取込（月次更新）
          <input type="file" accept=".xlsx,.xls" style="display:none" onchange="handleSunDenshiImport(event)">
        </label>
        <button class="btn btn-primary btn-sm" onclick="openFutureAddModal()">＋ 機種追加</button>
      </div>
    </div>
    <div id="sundenshi-nearterm-preview"></div>
    <div class="table-wrap" style="overflow-x:auto;">
      <table style="min-width:1400px;font-size:12px;">
        <thead>
          <tr>
            <th rowspan="2">機種コード</th>
            <th rowspan="2">機種名</th>
            <th rowspan="2">適合状況</th>
            <th rowspan="2">12Dコード</th>
            <th colspan="6" style="background:#eff6ff;color:#1d4ed8;text-align:center;border-bottom:1px solid #bfdbfe;">基本情報</th>
            <th colspan="3" style="background:#f0fdf4;color:#166534;text-align:center;border-bottom:1px solid #86efac;">🔬 見本機</th>
            <th colspan="6" style="background:#fff7ed;color:#92400e;text-align:center;border-bottom:1px solid #fcd34d;">⚙️ 量産</th>
            <th rowspan="2">備考</th>
            <th rowspan="2">操作</th>
          </tr>
          <tr>
            <th style="background:#eff6ff;">販売予定</th>
            <th style="background:#eff6ff;">適合日</th>
            <th style="background:#eff6ff;">生産計画</th>
            <th style="background:#eff6ff;">材料手配</th>
            <th style="background:#eff6ff;">実装手配</th>
            <th style="background:#eff6ff;">ホール導入</th>
            <th style="background:#f0fdf4;">基板</th>
            <th style="background:#f0fdf4;">基板種類</th>
            <th style="background:#f0fdf4;">初回納品</th>
            <th style="background:#fff7ed;">初回実装</th>
            <th style="background:#fff7ed;">初回組立</th>
            <th style="background:#fff7ed;">初回納品</th>
            <th style="background:#fff7ed;">納入日</th>
            <th style="background:#fff7ed;">台数</th>
            <th style="background:#fff7ed;">ロム種類</th>
          </tr>
        </thead>
        <tbody>${state.futureModels.length?rows:empty}</tbody>
      </table>
    </div>`;
}

function openFutureCell(td,id,key){
  const m=state.futureModels.find(x=>x.id===id); if(!m)return;
  const cur=m[key]||'';
  const inp=document.createElement('input');
  inp.type='date'; inp.value=cur; inp.style.cssText='width:130px;font-size:12px;padding:2px 4px;';
  td.innerHTML=''; td.appendChild(inp); inp.focus();
  const save=()=>{m[key]=inp.value;saveToGAS();renderFuturePage();addLog(`将来機種 ${m.code} ${key} 更新`);};
  inp.onblur=save; inp.onkeydown=e=>{if(e.key==='Enter')save();if(e.key==='Escape')renderFuturePage();};
}

function deleteFutureModel(id){
  if(!confirm('この機種を削除しますか?'))return;
  const m=state.futureModels.find(x=>x.id===id);
  state.futureModels=state.futureModels.filter(x=>x.id!==id);
  saveToGAS(); renderFuturePage();
  addLog(`将来機種削除: ${m?m.code:id}`);
  showToast('削除しました');
}

const FM_IDS=[
  'fm-code','fm-name','fm-salesDate','fm-complianceDate','fm-complianceStatus','fm-code12D',
  'fm-productionPlanDate','fm-materialDate','fm-mountingDate','fm-hallDate',
  'fm-sampleDeliveryDate','fm-sampleBoard','fm-sampleBoardType',
  'fm-prodFirstImplDate','fm-prodFirstAssyDate','fm-prodFirstDeliveryDate',
  'fm-deliveryDate','fm-prodQtyActual','fm-prodRomType','fm-prodMemo','fm-memo',
];

function openFutureAddModal(){
  document.getElementById('fm-id').value='';
  FM_IDS.forEach(fid=>{const el=document.getElementById(fid);if(el)el.value='';});
  document.getElementById('fm-modal-title').textContent='将来機種 追加';
  document.getElementById('future-modal').style.display='flex';
}

function openFutureEditModal(id){
  const m=state.futureModels.find(x=>x.id===id); if(!m)return;
  document.getElementById('fm-id').value=m.id;
  FM_IDS.forEach(fid=>{
    const key=fid.replace('fm-','').replace(/-([a-z])/g,(_,c)=>c.toUpperCase());
    const el=document.getElementById(fid);
    if(el)el.value=m[key]||'';
  });
  document.getElementById('fm-modal-title').textContent='将来機種 編集';
  document.getElementById('future-modal').style.display='flex';
}

function closeFutureModal(){
  document.getElementById('future-modal').style.display='none';
}

function saveFutureModal(){
  const code=document.getElementById('fm-code').value.trim();
  if(!code){showToast('⚠️ 機種コードを入力してください');return;}
  const eid=document.getElementById('fm-id').value;
  const obj={id:eid||('FM-'+Date.now())};
  FM_IDS.forEach(fid=>{
    const key=fid.replace('fm-','').replace(/-([a-z])/g,(_,c)=>c.toUpperCase());
    const el=document.getElementById(fid);
    obj[key]=el?el.value.trim():undefined;
  });
  if(eid){
    const idx=state.futureModels.findIndex(x=>x.id===eid);
    if(idx>=0)state.futureModels[idx]=obj;
  }else{
    state.futureModels.push(obj);
  }
  saveToGAS(); closeFutureModal(); renderFuturePage();
  addLog(`将来機種${eid?'更新':'追加'}: ${code}`);
  showToast(`✅ ${code} を${eid?'更新':'追加'}しました`);
}

// サン電子 生産計画Excel インポート（月次更新推奨）
function _guessMachineId(code){
  let c=String(code||'').replace(/^e:/i,'').trim();
  if(!c)return'';
  let m=MACHINES.find(x=>x.id===c);
  if(m)return m.id;
  const base=(c.match(/^[A-Za-z0-9]+/)||[c])[0];
  m=MACHINES.find(x=>x.id===base);
  if(m)return m.id;
  m=MACHINES.find(x=>base.startsWith(x.id)||x.id.startsWith(base));
  return m?m.id:'';
}

function handleSunDenshiImport(e){
  const file=e.target.files[0]; if(!file)return;
  e.target.value='';
  _loadXLSX(function(){
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary',cellDates:true});
        // 最新シートを選ぶ（日付っぽい名前 YYMMDD を降順）
        const dated=wb.SheetNames.filter(s=>/^\d{6}$/.test(s)).sort((a,b)=>b.localeCompare(a));
        const sheetName=dated[0]||wb.SheetNames[0];
        const ws=wb.Sheets[sheetName];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false});
        parseSunDenshiRows(raw,sheetName);
      }catch(err){showToast('⚠️ 読み込みエラー: '+err.message);}
    };
    reader.readAsBinaryString(file);
  });
}

function _excelDateStr(v){
  if(!v)return null;
  if(typeof v==='string'&&/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(v)){
    const d=new Date(v); if(!isNaN(d))return fmtDate(d);
  }
  if(typeof v==='number'&&v>40000&&v<80000){
    const d=XLSX.SSF.parse_date_code(v);
    if(d)return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  if(v instanceof Date&&!isNaN(v))return fmtDate(v);
  return null;
}

function parseSunDenshiRows(rows,sheetName){
  // 機種コード行: '機種名' ラベルのある行
  let codeRowIdx=-1, nameRowIdx=-1, salesRowIdx=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const row=rows[i];
    const joined=row.filter(Boolean).join('');
    if(joined.includes('機種名')&&codeRowIdx<0) codeRowIdx=i;
    if(joined.includes('タイトル')&&nameRowIdx<0) nameRowIdx=i;
    if(joined.includes('販売時期')&&salesRowIdx<0) salesRowIdx=i;
  }
  // フォールバック
  if(codeRowIdx<0) codeRowIdx=5;
  if(nameRowIdx<0) nameRowIdx=6;
  if(salesRowIdx<0) salesRowIdx=3;

  const codeRow=rows[codeRowIdx]||[];
  const nameRow=rows[nameRowIdx]||[];
  const salesRow=rows[salesRowIdx]||[];

  // データ開始列（機種コードが入っている列）を特定
  const startCol=codeRow.findIndex((v,i)=>i>=5&&v&&String(v).trim().length>0&&!['機種名','タイトル','販売時期'].includes(String(v).trim()));

  if(startCol<0){showToast('⚠️ 機種データ列が見つかりませんでした');return;}

  // ラベル行インデックスをスキャン（B列グループ・C列ラベル）で
  // 台数・基板の各行を検出（元シートの行位置が変わっても追従できるように）
  const labelIdx={};
  let curGroup=null;
  for(let i=0;i<rows.length;i++){
    const row=rows[i]||[];
    const bVal=row[1]!=null&&String(row[1]).trim()?String(row[1]).trim():null;
    if(bVal)curGroup=bVal;
    const cVal=row[2]!=null?String(row[2]).trim():'';
    if(!cVal)continue;
    if(!labelIdx[cVal])labelIdx[cVal]=[];
    labelIdx[cVal].push({idx:i,group:curGroup,b:bVal});
  }
  const firstIdx=lbl=>(labelIdx[lbl]&&labelIdx[lbl].length)?labelIdx[lbl][0].idx:-1;
  const idxByGroup=(lbl,group)=>{const arr=labelIdx[lbl]||[];const f=arr.find(x=>x.group===group);return f?f.idx:-1;};
  const aggDateRowIdx=firstIdx('部品集約時期');
  const brandRowIdx=firstIdx('販売ブランド');
  const targetQtyRowIdx=firstIdx('調達目標台数');
  const custSalesRowIdx=idxByGroup('販売台数','お客様計画数字');
  const sunSalesRowIdx=idxByGroup('販売台数','サン電子数値');
  const boardRows=(labelIdx['手配対象']||[]).map(x=>({cat:x.b,idx:x.idx}));

  const cutoff=new Date(); cutoff.setFullYear(cutoff.getFullYear()+1); // 1年超先 = 将来機種
  const found=[];      // 将来機種（1年以上先）
  const nearTerm=[];   // 既存機種の更新候補（1年以内）

  for(let col=startCol;col<codeRow.length;col++){
    const code=String(codeRow[col]||'').trim(); if(!code)continue;
    const name=String(nameRow[col]||'').trim();
    if(!name)continue; // 備考・ステータス列は機種名が空なので除外される
    const salesStr=_excelDateStr(salesRow[col]);
    if(!salesStr)continue;
    const salesD=new Date(salesStr);
    if(isNaN(salesD))continue;

    if(salesD>cutoff){
      // 1年以上先の機種のみ将来機種として取込
      if(state.futureModels.find(m=>m.code===code))continue;
      found.push({id:'FM-'+Date.now()+'-'+col, code, name, salesDate:salesStr,
        complianceDate:'',productionPlanDate:'',materialDate:'',mountingDate:'',deliveryDate:'',hallDate:'',memo:'サン電子計画取込'});
      continue;
    }

    // 1年以内 = 既存機種の最新データ候補
    const boards={};
    boardRows.forEach(br=>{
      const v=rows[br.idx]&&rows[br.idx][col];
      if(v!=null&&String(v).trim())boards[br.cat]=String(v).trim();
    });
    nearTerm.push({
      code, name,
      salesDate:salesStr,
      aggDate:aggDateRowIdx>=0?_excelDateStr(rows[aggDateRowIdx][col]):null,
      brand:brandRowIdx>=0?String(rows[brandRowIdx][col]||'').trim():'',
      targetQty:targetQtyRowIdx>=0?rows[targetQtyRowIdx][col]:null,
      custSalesQty:custSalesRowIdx>=0?rows[custSalesRowIdx][col]:null,
      sunSalesQty:sunSalesRowIdx>=0?rows[sunSalesRowIdx][col]:null,
      boards,
      guessId:_guessMachineId(code),
    });
  }

  if(found.length)state.futureModels.push(...found);
  saveToGAS(); renderFuturePage();
  if(found.length)addLog(`サン電子Excel取込: 将来機種 ${found.map(m=>m.code).join(', ')}`);
  _showSunDenshiImportPreview(found, nearTerm, sheetName);
}

/* 生産計画Excel取込 — 既存機種の更新プレビュー */
function _fmtQty(v){
  const n=parseFloat(String(v||'').replace(/[^\d.]/g,''));
  return(n>0)?n.toLocaleString('ja-JP')+'台':'';
}
function _showSunDenshiImportPreview(found, nearTerm, sheetName){
  const div=document.getElementById('sundenshi-nearterm-preview');
  if(!div)return;
  if(nearTerm.length===0){
    div.innerHTML=found.length
      ? `<div style="padding:10px 0;color:var(--text-sub);font-size:12px;">シート「${sheetName}」: 将来機種 ${found.length}件を取込みました。既存機種の更新候補（1年以内）はありませんでした。</div>`
      : `<div style="padding:10px 0;color:var(--text-sub);font-size:12px;">シート「${sheetName}」に取込対象データが見つかりませんでした。</div>`;
    return;
  }
  const optionsHtml=(sel)=>`<option value=""${sel===''?' selected':''}>－ スキップ －</option>`+
    MACHINES.map(m=>`<option value="${m.id}"${sel===m.id?' selected':''}>${m.id}</option>`).join('');

  const rowsHtml=nearTerm.map((r,i)=>{
    const boardStr=Object.entries(r.boards).map(([k,v])=>`${k}:${v}`).join(' / ')||'—';
    const qty=_fmtQty(r.custSalesQty)||_fmtQty(r.sunSalesQty)||_fmtQty(r.targetQty)||'未定';
    return`<tr>
      <td style="font-size:11px;">${r.code}</td>
      <td style="font-size:11px;">${r.name}</td>
      <td style="font-size:11px;white-space:nowrap;">${r.salesDate||'—'}</td>
      <td style="font-size:11px;">${qty}</td>
      <td style="font-size:10px;color:var(--text-sub);max-width:160px;">${boardStr}</td>
      <td><select data-i="${i}" class="ntp-sel" style="font-size:11px;padding:2px 4px;">${optionsHtml(r.guessId)}</select></td>
    </tr>`;
  }).join('');

  div.innerHTML=`
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px 14px;margin:12px 0;font-size:11px;color:#1e40af;">
      ℹ️ シート「${sheetName}」から <strong>${nearTerm.length}件</strong> の既存機種更新候補を検出しました（${found.length?`将来機種 ${found.length}件は自動取込済み。`:''}販売時期が1年以内のもの）。
      対象機種を確認し、反映する行を選んで実行してください。
    </div>
    <div style="overflow:auto;max-height:360px;border:1px solid var(--border);border-radius:6px;">
      <table style="font-size:12px;"><thead><tr style="position:sticky;top:0;background:#f8fafc;">
        <th>機種コード</th><th>タイトル</th><th>販売時期</th><th>台数</th><th>使用基板</th><th>反映先機種</th>
      </tr></thead><tbody>${rowsHtml}</tbody></table>
    </div>
    <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick='_applySunDenshiNearTerm(${JSON.stringify(nearTerm).replace(/'/g,"&#39;")}, ${JSON.stringify(sheetName)})'>✅ 選択した機種に反映</button>
    <button class="btn btn-sm" style="margin-left:8px;margin-top:10px;" onclick="document.getElementById('sundenshi-nearterm-preview').innerHTML=''">キャンセル</button>`;
}
</script>
